        :root {
          --bg: #FFFFFF;
          --fg: #0A0A0A;
          --muted: #6B6B6B;
          --border: #EEEEEE;
          --card-shadow: 0 8px 24px rgba(0,0,0,0.08);
          --card-shadow-hover: 0 16px 40px rgba(0,0,0,0.12);
        }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--fg); }
        /* Garet font stack - preserved name from original, falls back to system sans */

       @keyframes floatLogo {
          0%, 100% { transform: translateY(0) rotate(var(--rot)); }
          50% { transform: translateY(-22px) rotate(var(--rot)); }
        }
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(30px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardFloat {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-8px); }
        }
        .card-wrap {
          opacity: 0;
          animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
        }
        .card-float {
          animation: cardFloat 4s ease-in-out infinite;
          will-change: transform;
        }
        .card-float:hover {
          animation-play-state: paused;
        }
        /* Stagger entrance delays */
        .card-wrap:nth-child(1) { animation-delay: 0.05s; }
        .card-wrap:nth-child(2) { animation-delay: 0.18s; }
        .card-wrap:nth-child(3) { animation-delay: 0.31s; }
        .card-wrap:nth-child(4) { animation-delay: 0.44s; }
        .card-wrap:nth-child(5) { animation-delay: 0.57s; }
        .card-wrap:nth-child(6) { animation-delay: 0.70s; }
        /* Float durations + offsets per spec */
        .card-wrap:nth-child(1) .card-float { animation-duration: 4s; animation-delay: 0s; }
